# Dagster instance: run history, schedules and sensor state in Postgres.
# The URL names the psycopg2 driver: SQLAlchemy 2.1 defaults to psycopg 3,
# whose server-side parameters break Dagster's NOTIFY statements.
storage:
  postgres:
    postgres_url:
      env: DAGSTER_POSTGRES_URL

# One run at a time: silver applies snapshot dates in order and each run
# starts a Spark session, so queued runs execute in the order requested.
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/home/compute_logs

telemetry:
  enabled: false
