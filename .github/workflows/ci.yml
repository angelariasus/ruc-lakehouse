name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run pytest

  # Starts the whole local lakehouse and checks that a table written by Spark
  # is readable from Trino through the shared catalog.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: docker compose run --rm jobs python -m ruc_lakehouse.jobs.smoke
      - run: docker compose exec -T trino trino --execute "select count(*) from lakehouse.smoke.ping"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
