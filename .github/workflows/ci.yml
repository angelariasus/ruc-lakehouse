name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run sqlfluff lint dbt/models dbt/tests

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      # Parsing validates refs, sources, configs and tests without a database.
      - run: uv run dbt parse --project-dir dbt --profiles-dir dbt

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      # The Dagster definitions read the dbt manifest.
      - run: uv run dbt parse --project-dir dbt --profiles-dir dbt
      - run: uv run pytest

  # The AWS deployment, checked without an AWS account: lint, unit tests with a
  # mocked provider, then a full apply against Moto (an AWS API emulator), a
  # second plan that must show no changes, and a destroy.
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: tflint --init && tflint --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: terraform test
      - name: Start Moto
        run: |
          docker run -d --name moto -p 5000:5000 \
            -v "$PWD/tests/moto/server.py:/opt/moto/server.py:ro" \
            --entrypoint python motoserver/moto:5.2.4 /opt/moto/server.py -H 0.0.0.0 -p 5000
          # The provider sends S3 Control calls to <account id>.<endpoint host>.
          echo "127.0.0.1 123456789012.localhost" | sudo tee -a /etc/hosts
          timeout 60 sh -c 'until curl -sf http://localhost:5000/moto-api/ > /dev/null; do sleep 1; done'
      - name: Apply, check for drift, destroy
        env:
          AWS_ENDPOINT_URL: http://localhost:5000
        run: |
          cp tests/moto/override.tf override.tf
          terraform init -input=false -reconfigure
          terraform apply -auto-approve -input=false -var-file=tests/moto.tfvars
          terraform plan -detailed-exitcode -input=false -var-file=tests/moto.tfvars
          test "$(aws glue get-databases --query 'length(DatabaseList)')" = 6
          test "$(aws emr-serverless list-applications --query 'length(applications)')" = 1
          terraform destroy -auto-approve -input=false -var-file=tests/moto.tfvars
      - if: failure()
        run: docker logs moto 2>&1 | tail -100

  # Starts the whole local lakehouse and loads two consecutive days of real
  # padron snapshots (a sample cut by tests/e2e/build_sample.py: 3,155 legal
  # entities, with the 155 that changed and the 39 that appeared on day 2).
  # Then it builds gold and checks the result from Trino.
  stack:
    runs-on: ubuntu-latest
    env:
      DAY1: "2026-10-25"
      DAY2: "2026-10-26"
      SNAPSHOTS_HOST_DIR: ./tests/e2e/snapshots
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: docker compose run --rm jobs python -m ruc_lakehouse.jobs.smoke
      - name: Load both days
        run: |
          for day in "$DAY1" "$DAY2"; do
            docker compose run --rm jobs python -m ruc_lakehouse.ingest.landing "$day"
            docker compose run --rm jobs python -m ruc_lakehouse.jobs.bronze "$day"
            docker compose run --rm jobs python -m ruc_lakehouse.jobs.silver "$day"
          done
      - run: docker compose run --rm jobs dbt build
      - name: Check bronze, silver and gold from Trino
        run: |
          query() { docker compose exec -T trino trino --output-format CSV_UNQUOTED --execute "$1" | tail -1; }
          check() { echo "$1: got $2, expected $3"; test "$2" = "$3"; }
          check "bronze day 1" "$(query "select count(*) from lakehouse.bronze.padron_ruc where snapshot_date = date '$DAY1'")" 3155
          check "bronze day 2" "$(query "select count(*) from lakehouse.bronze.padron_ruc where snapshot_date = date '$DAY2'")" 3194
          check "rejects" "$(query "select count(*) from lakehouse.bronze.padron_ruc_rejects")" 2
          check "history rows" "$(query "select count(*) from lakehouse.silver.taxpayers_history")" 3349
          check "current rows" "$(query "select count_if(is_current) from lakehouse.silver.taxpayers_history")" 3194
          check "changed" "$(query "select count_if(end_reason = 'changed') from lakehouse.silver.taxpayers_history")" 155
          events() { query "select count(*) from lakehouse.gold.fct_taxpayer_events where snapshot_date = date '$DAY2' and event_type = '$1'"; }
          check "registered events" "$(events registered)" 39
          check "status changes" "$(events status_changed)" 62
          check "address condition changes" "$(events address_condition_changed)" 83
          check "registry on day 2" "$(query "select sum(taxpayers) from lakehouse.gold.agg_registry_daily where snapshot_date = date '$DAY2'")" 3194
      # Day 2's merge left a delete file in silver: compaction must fold it in
      # without changing a row. Bronze keeps only day 2 with --bronze-days 0.
      - name: Maintenance
        run: |
          query() { docker compose exec -T trino trino --output-format CSV_UNQUOTED --execute "$1" | tail -1; }
          check() { echo "$1: got $2, expected $3"; test "$2" = "$3"; }
          delete_files() { query "select count(*) from lakehouse.silver.\"taxpayers_history\$files\" where content <> 0"; }
          check "silver delete files before" "$(delete_files)" 1
          docker compose run --rm jobs python -m ruc_lakehouse.jobs.maintenance --bronze-days 0
          check "silver delete files after" "$(delete_files)" 0
          check "history rows" "$(query "select count(*) from lakehouse.silver.taxpayers_history")" 3349
          check "current rows" "$(query "select count_if(is_current) from lakehouse.silver.taxpayers_history")" 3194
          check "bronze days" "$(query "select count(distinct snapshot_date) from lakehouse.bronze.padron_ruc")" 1
          check "maintenance run" "$(query "select status from lakehouse.ops.job_runs where job = 'maintenance'")" succeeded
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
