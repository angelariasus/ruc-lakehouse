[project]
name = "ruc-lakehouse"
version = "0.1.0"
description = "Cloud-ready lakehouse that turns SUNAT's daily taxpayer registry snapshots (padron RUC) into history."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Iceberg ships a Spark runtime per Spark minor version: keep both in step.
    "pyspark>=4.1,<4.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=9.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ruc_lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "spark: starts a local Spark session (needs Java 17 or 21)",
]
