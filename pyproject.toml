[project]
name = "ruc-lakehouse"
version = "0.1.0"
description = "Cloud-ready lakehouse that turns SUNAT's daily taxpayer registry snapshots (padron RUC) into history."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.40",
    "dagster>=1.13,<1.14",
    "dagster-dbt>=0.29,<0.30",
    "dagster-pipes>=1.13,<1.14",
    "dagster-postgres>=0.29,<0.30",
    "dagster-webserver>=1.13,<1.14",
    "dbt-core>=1.12,<1.13",
    "dbt-trino>=1.10",
    # Driver for dagster-postgres, which does not install one itself. Dagster's
    # queries expect psycopg2 (client-side parameters), not psycopg 3.
    "psycopg2-binary>=2.9",
    # Iceberg ships a Spark runtime per Spark minor version: keep both in step.
    "pyspark>=4.1,<4.2",
]

[dependency-groups]
# What the Spark jobs import on EMR Serverless, whose runtime provides Spark
# (see docker/emr/Dockerfile).
job = [
    "boto3>=1.40",
    "dagster-pipes>=1.13,<1.14",
]
dev = [
    "moto[s3]>=5.2",
    "pre-commit>=4.0",
    "pytest>=9.0",
    "ruff>=0.17",
    "sqlfluff>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ruc_lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "spark: starts a local Spark session (needs Java 17 or 21)",
]
